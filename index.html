<style>
:root{
  --bg:#eef2f7; --surface:#ffffff; --ink:#15213b; --muted:#5d6b85; --line:#d8e0ec; --soft:#e4eaf4;
  --gold:#f2b632; --gold-ink:#3a2a00; --teal:#1f8a85; --red:#d6453d;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1525; --surface:#18233b; --ink:#eaf0fb; --muted:#9aa9c4; --line:#2a3858; --soft:#202d49;
    --teal:#3bb5ae; --red:#ef6b63; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1525; --surface:#18233b; --ink:#eaf0fb; --muted:#9aa9c4; --line:#2a3858; --soft:#202d49;
  --teal:#3bb5ae; --red:#ef6b63; color-scheme: dark;
}
html{ scroll-padding-top: env(safe-area-inset-top, 0px); height:100%; }
*,*::before,*::after{ box-sizing:border-box; }
[hidden]{ display:none !important; }
body{
  margin:0; height:100%; background:var(--bg); color:var(--ink);
  font:16px/1.4 Figtree, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-tap-highlight-color: transparent; overscroll-behavior:none;
}
button{ font:inherit; color:inherit; cursor:pointer; }
button:focus-visible, input:focus-visible{ outline:3px solid var(--gold); outline-offset:2px; }

#app{ height:100%; max-width:520px; margin:0 auto; display:flex; flex-direction:column; position:relative; }
header{ padding:14px 18px 8px; display:flex; align-items:center; gap:12px; }
header .logo{ width:38px; height:38px; flex:none; }
h1{ margin:0; font:800 26px/1 "Bricolage Grotesque", Figtree, system-ui, sans-serif; letter-spacing:-.02em; }
#sub{ margin:3px 0 0; font-size:13px; color:var(--muted); }
main{ flex:1; overflow-y:auto; padding:8px 16px 24px; -webkit-overflow-scrolling:touch; }

h2{ margin:18px 2px 8px; font:700 18px/1.2 "Bricolage Grotesque", Figtree, system-ui, sans-serif; }
h2:first-child{ margin-top:6px; }
.hint{ margin:6px 2px 12px; color:var(--muted); font-size:14px; }
.empty{ border:2px dashed var(--line); border-radius:16px; padding:22px 18px; text-align:center; color:var(--muted); margin-top:10px; }
.empty .btn{ margin-top:12px; }

.list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
.row{ display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:10px 12px; min-height:56px; }
.row .name{ flex:1; min-width:0; font-weight:600; font-size:17px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

.addrow{ display:flex; gap:8px; }
input[type=text]{ flex:1; min-width:0; height:48px; border-radius:12px; border:1px solid var(--line); background:var(--surface); color:var(--ink); padding:0 14px; font:inherit; font-size:16px; }
input[type=text]::placeholder{ color:var(--muted); }

.btn{ height:48px; border-radius:12px; border:1px solid var(--line); background:var(--surface); padding:0 18px; font-weight:700; }
.btn.primary{ background:var(--gold); border-color:var(--gold); color:var(--gold-ink); }
.btn.danger{ color:var(--red); }
.btn.block{ width:100%; }
.btn:disabled{ opacity:.45; cursor:not-allowed; }
.icon{ width:40px; height:40px; border-radius:10px; border:1px solid var(--line); background:var(--bg); display:grid; place-items:center; font-size:20px; line-height:1; flex:none; }
.icon.danger{ color:var(--red); }

.stepper{ display:flex; align-items:center; gap:2px; }
.stepper b{ min-width:34px; text-align:center; font-variant-numeric:tabular-nums; font-size:17px; }
.stepper small{ color:var(--muted); font-size:12px; margin-right:6px; }

/* asistencia */
.att{ width:100%; text-align:left; display:flex; align-items:center; gap:12px; min-height:62px; padding:10px 14px; border-radius:14px; border:1px solid var(--line); background:var(--surface); }
.att .box{ width:26px; height:26px; border-radius:8px; border:2px solid var(--line); display:grid; place-items:center; flex:none; color:transparent; font-weight:800; }
.att .name{ flex:1; font-weight:600; font-size:17px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.chip-pts{ font-variant-numeric:tabular-nums; font-weight:700; font-size:14px; padding:4px 10px; border-radius:999px; background:var(--soft); }
.att.on{ background:var(--gold); border-color:var(--gold); color:var(--gold-ink); }
.att.on .box{ background:var(--gold-ink); border-color:var(--gold-ink); color:var(--gold); }
.att.on .chip-pts{ background:rgba(58,42,0,.16); }

/* pelis */
.chips{ display:flex; flex-wrap:wrap; gap:8px; }
.pchip{ border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:9px 14px; font-weight:600; display:flex; gap:6px; align-items:center; }
.pchip .ok{ color:var(--teal); font-weight:800; }
.pchip.sel{ background:var(--ink); border-color:var(--ink); color:var(--bg); }
.pchip.sel .ok{ color:var(--gold); }
.panel{ background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:14px; margin-top:12px; }
.panel .who{ margin:0 0 10px; font-weight:600; }
.panel .who span{ color:var(--muted); font-weight:400; }
.status{ font-size:13px; color:var(--muted); margin:10px 2px 6px; min-height:18px; }
.results{ display:flex; flex-direction:column; gap:6px; }
.res{ display:flex; gap:12px; align-items:center; text-align:left; width:100%; border:1px solid var(--line); background:var(--bg); border-radius:12px; padding:8px; }
.res .t{ flex:1; min-width:0; }
.res .t b{ display:block; font-weight:600; line-height:1.25; }
.res .t span{ color:var(--muted); font-size:13px; }
.res .plus{ font-weight:800; font-size:20px; color:var(--gold-ink); background:var(--gold); width:34px; height:34px; border-radius:50%; display:grid; place-items:center; flex:none; }
.thumb{ position:relative; width:42px; height:60px; border-radius:6px; background:var(--soft); overflow:hidden; flex:none; display:grid; place-items:center; font:800 18px "Bricolage Grotesque", sans-serif; color:var(--muted); }
.thumb img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.prop{ display:flex; align-items:center; gap:12px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:8px 8px 8px 8px; }
.prop .t{ flex:1; min-width:0; }
.prop .t b{ display:block; line-height:1.25; }
.prop .t span{ color:var(--muted); font-size:13px; }

/* ruleta */
.wheelwrap{ position:relative; width:100%; max-width:380px; margin:14px auto 6px; }
#wheel{ display:block; width:100%; aspect-ratio:1; }
.pointer{ position:absolute; left:50%; top:-4px; width:30px; height:36px; transform:translateX(-50%); filter:drop-shadow(0 2px 2px rgba(0,0,0,.35)); }
.legend .row{ min-height:50px; padding:8px 12px; }
.dot{ width:14px; height:14px; border-radius:50%; flex:none; }
.legend .t{ flex:1; min-width:0; }
.legend .t b{ display:block; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.legend .t span{ font-size:13px; color:var(--muted); }
.pct{ font-weight:700; font-variant-numeric:tabular-nums; }
.hist{ color:var(--muted); font-size:14px; }
.hist li{ display:flex; justify-content:space-between; gap:10px; padding:6px 2px; border-bottom:1px solid var(--line); }
.hist li b{ color:var(--ink); font-weight:600; }

nav{ display:flex; background:var(--surface); border-top:1px solid var(--line); }
.tab{ flex:1; border:0; background:none; padding:9px 2px 8px; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:12px; font-weight:600; color:var(--muted); position:relative; }
.tab svg{ width:24px; height:24px; }
.tab.on{ color:var(--ink); }
.tab.on::before{ content:""; position:absolute; top:-1px; left:22%; right:22%; height:3px; border-radius:0 0 3px 3px; background:var(--gold); }

#toast{ position:absolute; left:50%; bottom:84px; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:999px; font-weight:600; font-size:14px; box-shadow:0 6px 18px rgba(0,0,0,.25); z-index:30; max-width:90%; text-align:center; }

#dlg{ position:fixed; inset:0; background:rgba(8,12,24,.55); display:flex; align-items:center; justify-content:center; padding:24px; z-index:40; }
.dlg-card{ background:var(--surface); border-radius:18px; padding:20px; width:min(100%, 360px); }
.dlg-card p{ margin:0 0 16px; font-size:16px; }
.dlg-actions{ display:flex; gap:8px; justify-content:flex-end; }

.helpbtn{ font:800 18px "Bricolage Grotesque", Figtree, sans-serif; background:var(--surface); }
.dlg-card.help{ max-height:85vh; overflow-y:auto; }
.dlg-card.help h3{ margin:0 0 10px; font:800 20px "Bricolage Grotesque", Figtree, sans-serif; }
.dlg-card.help ol{ margin:0 0 14px; padding-left:20px; display:flex; flex-direction:column; gap:8px; font-size:15px; }
.dlg-card.help p{ font-size:14px; color:var(--muted); margin:0 0 16px; }

/* ticket ganador */
#win{ position:fixed; inset:0; background:#16213e; z-index:50; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; padding-top:calc(24px + env(safe-area-inset-top, 0px)); padding-bottom:calc(24px + env(safe-area-inset-bottom, 0px)); overflow-y:auto; }
.ticket{ width:min(100%, 360px); background:#f2b632; color:#3a2a00; border-radius:18px; box-shadow:0 20px 50px rgba(0,0,0,.45); animation:drop .5s cubic-bezier(.2,.9,.3,1.2); }
@keyframes drop{ from{ transform:translateY(-30px) rotate(-3deg); opacity:0; } to{ transform:none; opacity:1; } }
@media (prefers-reduced-motion: reduce){ .ticket{ animation:none; } }
.t-top{ padding:24px 22px 18px; display:flex; gap:14px; align-items:flex-start; }
.t-top small{ font-weight:700; font-size:14px; opacity:.75; }
.t-top h2{ margin:6px 0 4px; font:800 28px/1.08 "Bricolage Grotesque", Figtree, sans-serif; letter-spacing:-.01em; }
.t-top .thumb{ width:64px; height:92px; background:rgba(58,42,0,.12); color:#3a2a00; }
.perf{ height:24px; position:relative; background:repeating-linear-gradient(90deg, rgba(58,42,0,.45) 0 8px, transparent 8px 16px) center / calc(100% - 40px) 2px no-repeat; }
.perf::before,.perf::after{ content:""; position:absolute; top:0; width:24px; height:24px; border-radius:50%; background:#16213e; }
.perf::before{ left:-12px; } .perf::after{ right:-12px; }
.t-bot{ padding:16px 22px 22px; }
.t-bot p{ margin:0 0 4px; }
.win-actions{ width:min(100%, 360px); display:flex; gap:8px; margin-top:18px; }
.win-actions .btn{ flex:1; background:transparent; border-color:#3b4a73; color:#eaf0fb; }
.win-actions .btn.primary{ background:#f2b632; border-color:#f2b632; color:#3a2a00; }
</style>

<script>
/* ---------- Utilidades y estado ---------- */
const $ = s => document.querySelector(s);
const TAU = Math.PI * 2;
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const norm = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const KEY = 'cineforo:v1';

function load(){
  const base = { people:[], movies:[], history:[], tab:'club' };
  try { const r = localStorage.getItem(KEY); if (r) return Object.assign(base, JSON.parse(r)); } catch(e){}
  return base;
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }

const CATALOG = RAW.split('\n').map(l => { const [t, y] = l.split('|'); return { title:t.trim(), year:(y||'').trim(), poster:'' }; });

function localSearch(q){
  const words = norm(q).split(/\s+/).filter(Boolean);
  return CATALOG.filter(m => { const t = norm(m.title); return words.every(w => t.includes(w)); }).slice(0, 15);
}

/* ---------- Búsqueda online (iTunes Search API: sin clave) ---------- */
async function onlineSearch(q){
  const ctrl = new AbortController();
  const to = setTimeout(() => ctrl.abort(), 4500);
  try {
    const url = 'https://itunes.apple.com/search?media=movie&entity=movie&country=es&limit=14&term=' + encodeURIComponent(q);
    const r = await fetch(url, { signal: ctrl.signal });
    if (!r.ok) throw new Error('http');
    const j = await r.json();
    const seen = new Set();
    return (j.results || []).filter(x => x.trackName).map(x => ({
      title: x.trackName,
      year: x.releaseDate ? String(x.releaseDate).slice(0, 4) : '',
      poster: x.artworkUrl100 ? x.artworkUrl100.replace(/\d+x\d+bb/, '300x300bb') : ''
    })).filter(m => { const k = norm(m.title) + m.year; if (seen.has(k)) return false; seen.add(k); return true; });
  } finally { clearTimeout(to); }
}

async function runSearch(q){
  const seq = ++searchSeq;
  const box = $('#results'), st = $('#status');
  if (!box) return;
  lastQuery = q;
  if (q.trim().length < 2){ lastResults = []; box.innerHTML = ''; st.textContent = 'Escribe al menos 2 letras.'; return; }
  st.textContent = 'Buscando…';
  let list = [], mode = 'online';
  try { list = await onlineSearch(q); } catch(e){ list = []; mode = 'offline'; }
  if (!list.length){ const loc = localSearch(q); if (loc.length || mode === 'offline'){ list = loc; mode = 'offline'; } }
  if (seq !== searchSeq || !$('#results')) return;
  lastResults = list;
  st.textContent = list.length
    ? (mode === 'online' ? 'Resultados de internet' : 'Sin conexión: catálogo del club (' + CATALOG.length + ' pelis)')
    : 'No encontramos esa peli.';
  $('#results').innerHTML = list.map((m, i) => resHTML(m, i)).join('') +
    `<button class="res" data-act="manual"><span class="thumb">+</span><span class="t"><b>Añadir «${esc(q.trim())}» tal cual</b><span>Si no aparece en la búsqueda</span></span></button>`;
}
function thumb(m){
  return `<span class="thumb">${esc((m.title || '?').trim().charAt(0).toUpperCase())}${m.poster ? `<img src="${esc(m.poster)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : ''}</span>`;
}
function resHTML(m, i){
  return `<button class="res" data-act="pick" data-i="${i}">${thumb(m)}<span class="t"><b>${esc(m.title)}</b><span>${esc(m.year)}</span></span><span class="plus">+</span></button>`;
}
document.addEventListener('error', e => { if (e.target && e.target.tagName === 'IMG') e.target.style.display = 'none'; }, true);

/* ---------- Avisos ---------- */
let toastTimer;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2200);
}
function ask(msg, yesLabel, cb){
  const d = $('#dlg');
  d.innerHTML = `<div class="dlg-card" role="alertdialog"><p>${esc(msg)}</p><div class="dlg-actions"><button class="btn" data-dlg="no">Cancelar</button><button class="btn danger" data-dlg="yes">${esc(yesLabel)}</button></div></div>`;
  d.hidden = false;
  d.onclick = e => {
    const b = e.target.closest('[data-dlg]');
    if (!b && e.target !== d) return;
    d.hidden = true;
    if (b && b.dataset.dlg === 'yes') cb();
  };
}

/* ---------- Vistas ---------- */
function viewClub(v){
  const rows = S.people.map(p => `
    <li class="row">
      <span class="name">${esc(p.name)}</span>
      <div class="stepper">
        <small>puntos</small>
        <button class="icon" data-act="dec" data-id="${p.id}" aria-label="Quitar punto a ${esc(p.name)}">−</button>
        <b>${p.points}</b>
        <button class="icon" data-act="inc" data-id="${p.id}" aria-label="Dar punto a ${esc(p.name)}">+</button>
      </div>
      <button class="icon danger" data-act="del" data-id="${p.id}" aria-label="Eliminar a ${esc(p.name)}">×</button>
    </li>`).join('');
  v.innerHTML = `
    <h2>Participantes del club</h2>
    <div class="addrow">
      <input id="newName" type="text" placeholder="Nombre" maxlength="30" autocomplete="off" aria-label="Nombre del participante">
      <button class="btn primary" data-act="add">Añadir</button>
    </div>
    <p class="hint">Todos empiezan con 1 punto. Los botones − y + sirven para corregir puntos a mano.</p>
    ${S.people.length ? `<ul class="list">${rows}</ul>` : `<div class="empty">Aún no hay participantes.<br>Escribe un nombre arriba para empezar.</div>`}
    ${S.people.length ? `<h2>Zona de reinicio</h2><button class="btn danger block" data-act="resetall">Borrar todo y empezar de cero</button>` : ''}`;
}

function viewAsist(v){
  if (!S.people.length){
    v.innerHTML = `<h2>Asistencia de hoy</h2><div class="empty">Primero añade a los participantes del club.<br><button class="btn primary" data-act="goto" data-id="club">Ir a Club</button></div>`;
    return;
  }
  const n = presentPeople().length;
  v.innerHTML = `
    <h2>Asistencia de hoy</h2>
    <p class="hint">Toca a cada persona que ha venido. Al marcarla gana 1 punto automáticamente (si te equivocas, vuelve a tocar y se lo quita). Han venido ${n} de ${S.people.length}.</p>
    <ul class="list">${S.people.map(p => `
      <li><button class="att ${p.present ? 'on' : ''}" data-act="toggle" data-id="${p.id}" aria-pressed="${p.present}">
        <span class="box">✓</span><span class="name">${esc(p.name)}</span><span class="chip-pts">${p.points} ${p.points === 1 ? 'pt' : 'pts'}</span>
      </button></li>`).join('')}</ul>`;
}

function viewPelis(v){
  const pres = presentPeople();
  if (!pres.length){
    v.innerHTML = `<h2>Propuestas de pelis</h2><div class="empty">Marca primero quién ha venido para que puedan proponer peli.<br><button class="btn primary" data-act="goto" data-id="asistencia">Ir a Asistencia</button></div>`;
    return;
  }
  if (sel && !pres.find(p => p.id === sel)) sel = null;
  const chips = pres.map(p => `<button class="pchip ${sel === p.id ? 'sel' : ''}" data-act="sel" data-id="${p.id}">${movieOf(p.id) ? '<span class="ok">✓</span>' : ''}${esc(p.name)}</button>`).join('');
  const pending = pres.filter(p => !movieOf(p.id)).length;
  let panel = '';
  if (sel){
    const p = person(sel), cur = movieOf(sel);
    panel = `<div class="panel">
      <p class="who">Peli de ${esc(p.name)} <span>· ${p.points} ${p.points === 1 ? 'punto' : 'puntos'}</span></p>
      ${cur ? `<p class="hint" style="margin-top:0">Ahora propone «${esc(cur.title)}». Si eliges otra, la sustituye.</p>` : ''}
      <input id="q" type="text" placeholder="Buscar película…" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Buscar película">
      <div class="status" id="status">Escribe al menos 2 letras.</div>
      <div class="results" id="results"></div>
    </div>`;
  }
  const props = S.movies.map(m => { const p = person(m.personId); return p ? `
    <li class="prop">${thumb(m)}<span class="t"><b>${esc(m.title)}</b><span>${m.year ? esc(m.year) + ' · ' : ''}${esc(p.name)}</span></span>
    <button class="icon danger" data-act="rmmovie" data-id="${m.id}" aria-label="Quitar ${esc(m.title)}">×</button></li>` : ''; }).join('');
  v.innerHTML = `
    <h2>¿Quién propone?</h2>
    <p class="hint">${pending ? `Faltan por proponer: ${pending}. ` : 'Todos han propuesto. '}Elige a una persona y busca su peli.</p>
    <div class="chips">${chips}</div>
    ${panel}
    <h2>Propuestas (${S.movies.length})</h2>
    ${props ? `<ul class="list">${props}</ul>` : `<div class="empty">Todavía no hay ninguna peli en la ruleta.</div>`}`;
  if (sel){ const q = $('#q'); if (q){ q.focus({ preventScroll:false }); if (lastQuery && searchSeq){ /* nueva persona: búsqueda limpia */ } } }
}

const COLORS = ['#f2b632', '#1f8a85', '#e0574f', '#4b6cb7', '#8e5ea2', '#e78a3f', '#3aa56b', '#d9648f'];
function lum(hex){ const n = parseInt(hex.slice(1), 16); const r = n >> 16, g = (n >> 8) & 255, b = n & 255; return (0.299*r + 0.587*g + 0.114*b) / 255; }
function wheelItems(){
  return S.movies.map(m => { const p = person(m.personId); return p ? { m, p, w: Math.max(1, p.points) } : null; }).filter(Boolean);
}
function colorFor(i, n){
  let c = i % COLORS.length;
  if (i === n - 1 && n > 1 && c === 0) c = 1 + (i % (COLORS.length - 1));
  return COLORS[c];
}

function viewRuleta(v){
  const items = wheelItems();
  const total = items.reduce((a, it) => a + it.w, 0);
  const legend = items.map((it, i) => `
    <li class="row"><span class="dot" style="background:${colorFor(i, items.length)}"></span>
    <span class="t"><b>${esc(it.m.title)}</b><span>${esc(it.p.name)} · ${it.w} ${it.w === 1 ? 'punto' : 'puntos'}</span></span>
    <span class="pct">${Math.round(it.w / total * 100)}%</span></li>`).join('');
  const hist = S.history.slice(0, 5).map(h => `<li><span><b>${esc(h.title)}</b> · ${esc(h.name)}</span><span>${new Date(h.date).toLocaleDateString('es-ES', { day:'numeric', month:'short' })}</span></li>`).join('');
  v.innerHTML = `
    <div class="wheelwrap">
      <svg class="pointer" viewBox="0 0 30 36" aria-hidden="true"><path d="M15 35 3 9C3 3 9 1 15 1s12 2 12 8z" fill="#e0574f" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/></svg>
      <canvas id="wheel" aria-label="Ruleta de películas"></canvas>
    </div>
    <button class="btn primary block" id="spinBtn" data-act="spin" ${items.length < 2 || spinning ? 'disabled' : ''}>${items.length < 2 ? 'Necesitas al menos 2 propuestas' : 'Girar la ruleta'}</button>
    ${items.length ? `<h2>Probabilidades</h2><ul class="list legend">${legend}</ul>` : ''}
    ${hist ? `<h2>Últimas elegidas</h2><ul class="list hist" style="gap:0">${hist}</ul>` : ''}`;
  drawWheel();
}

function fit(ctx, t, max){
  if (ctx.measureText(t).width <= max) return t;
  while (t.length > 1 && ctx.measureText(t + '…').width > max) t = t.slice(0, -1);
  return t + '…';
}
function drawWheel(){
  const cv = $('#wheel'); if (!cv) return;
  const size = cv.clientWidth; if (!size) return;
  const dpr = window.devicePixelRatio || 1;
  if (cv.width !== Math.round(size * dpr)){ cv.width = Math.round(size * dpr); cv.height = Math.round(size * dpr); }
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, size, size);
  const css = getComputedStyle(document.documentElement);
  const surface = css.getPropertyValue('--surface').trim() || '#fff';
  const ink = css.getPropertyValue('--ink').trim() || '#15213b';
  const muted = css.getPropertyValue('--muted').trim() || '#5d6b85';
  const cx = size / 2, R = size / 2 - 8;
  const items = wheelItems();
  if (!items.length){
    ctx.beginPath(); ctx.arc(cx, cx, R, 0, TAU); ctx.setLineDash([8, 8]); ctx.lineWidth = 3; ctx.strokeStyle = muted; ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = muted; ctx.font = `600 ${Math.round(size / 22)}px Figtree, system-ui, sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('Añade propuestas en la pestaña Pelis', cx, cx);
    return;
  }
  const total = items.reduce((a, it) => a + it.w, 0);
  const fs = Math.max(11, Math.round(size / 27));
  let a = rot;
  items.forEach((it, i) => {
    const ang = it.w / total * TAU, col = colorFor(i, items.length);
    ctx.beginPath(); ctx.moveTo(cx, cx); ctx.arc(cx, cx, R, a, a + ang); ctx.closePath();
    ctx.fillStyle = col; ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = surface; ctx.stroke();
    if (items.length === 1 || ang * R * 0.75 > fs + 2){
      ctx.save(); ctx.translate(cx, cx); ctx.rotate(a + ang / 2);
      ctx.font = `700 ${fs}px Figtree, system-ui, sans-serif`; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
      ctx.fillStyle = lum(col) > 0.6 ? '#2a1f00' : '#ffffff';
      ctx.fillText(fit(ctx, it.m.title, R * 0.66), R - 14, 0);
      ctx.restore();
    }
    a += ang;
  });
  ctx.beginPath(); ctx.arc(cx, cx, R, 0, TAU); ctx.lineWidth = 4; ctx.strokeStyle = ink; ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cx, R * 0.11, 0, TAU); ctx.fillStyle = ink; ctx.fill();
  ctx.beginPath(); ctx.arc(cx, cx, R * 0.045, 0, TAU); ctx.fillStyle = '#f2b632'; ctx.fill();
}

/* ---------- Sorteo ---------- */
function spin(){
  if (spinning) return;
  const items = wheelItems();
  if (items.length < 2) return;
  const total = items.reduce((a, it) => a + it.w, 0);
  // 1) El ganador se decide con probabilidad ponderada por puntos
  let r = Math.random() * total, wi = 0;
  for (let i = 0; i < items.length; i++){ r -= items[i].w; if (r < 0){ wi = i; break; } }
  // 2) Calculamos dónde debe quedar la ruleta para que el puntero (arriba) apunte a esa porción
  let start = 0;
  for (let i = 0; i < wi; i++) start += items[i].w / total * TAU;
  const segAng = items[wi].w / total * TAU;
  const target = start + segAng * (0.12 + Math.random() * 0.76);
  const final = -Math.PI / 2 - target;
  const delta = (((final - rot) % TAU) + TAU) % TAU + TAU * (5 + Math.floor(Math.random() * 3));
  const from = rot, dur = 5400, t0 = performance.now();
  spinning = true;
  const btn = $('#spinBtn'); if (btn){ btn.disabled = true; btn.textContent = 'Girando…'; }
  const ease = t => 1 - Math.pow(1 - t, 4);
  (function frame(now){
    const t = Math.min(1, (now - t0) / dur);
    rot = from + delta * ease(t);
    drawWheel();
    if (t < 1) requestAnimationFrame(frame);
    else { rot = ((rot % TAU) + TAU) % TAU; spinning = false; finish(items[wi]); }
  })(t0);
}

function finish(it){
  const prev = it.p.points;
  it.p.points = 1;                                  // se resetea la probabilidad del ganador
  S.history.unshift({ title: it.m.title, year: it.m.year, name: it.p.name, date: Date.now() });
  S.history = S.history.slice(0, 30);
  save();
  try { navigator.vibrate && navigator.vibrate([80, 60, 160]); } catch(e){}
  const w = $('#win');
  w.innerHTML = `
    <div class="ticket">
      <div class="t-top">
        ${it.m.poster ? thumb(it.m) : ''}
        <div><small>Esta noche vemos</small><h2>${esc(it.m.title)}</h2>${it.m.year ? `<small>${esc(it.m.year)}</small>` : ''}</div>
      </div>
      <div class="perf"></div>
      <div class="t-bot">
        <p>Propuesta de <b>${esc(it.p.name)}</b></p>
        <p style="font-size:14px;opacity:.8">Sus puntos vuelven de ${prev} a 1.</p>
      </div>
    </div>
    <div class="win-actions">
      <button class="btn" data-win="close">Cerrar</button>
      <button class="btn primary" data-win="new">Nueva sesión</button>
    </div>`;
  w.hidden = false;
  render();
}
$('#win').addEventListener('click', e => {
  const b = e.target.closest('[data-win]'); if (!b) return;
  $('#win').hidden = true;
  if (b.dataset.win === 'new'){
    S.people.forEach(p => p.present = false);
    S.movies = []; sel = null; rot = 0; S.tab = 'asistencia'; save();
    toast('Sesión nueva: marca quién viene');
  }
  render();
});

/* ---------- Acciones ---------- */
function addPerson(){
  const inp = $('#newName'); if (!inp) return;
  const name = inp.value.trim().replace(/\s+/g, ' ');
  if (!name) return;
  if (S.people.some(p => norm(p.name) === norm(name))){ toast('Ya existe ' + name); return; }
  S.people.push({ id: uid(), name, points: 1, present: false });
  save(); render();
  const n = $('#newName'); if (n) n.focus();
}
function addMovie(m){
  if (!sel) return;
  S.movies = S.movies.filter(x => x.personId !== sel);
  S.movies.push({ id: uid(), personId: sel, title: m.title, year: m.year || '', poster: m.poster || '' });
  const p = person(sel);
  sel = null; lastQuery = ''; searchSeq++;
  save(); render(); toast('«' + m.title + '» añadida para ' + p.name);
}

$('#view').addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const { act, id, i } = el.dataset;
  const p = id ? person(id) : null;
  switch (act){
    case 'add': addPerson(); break;
    case 'inc': if (p){ p.points++; save(); render(); } break;
    case 'dec': if (p){ p.points = Math.max(1, p.points - 1); save(); render(); } break;
    case 'del': if (p) ask('¿Eliminar a ' + p.name + ' del club?', 'Eliminar', () => {
        S.people = S.people.filter(x => x.id !== p.id); S.movies = S.movies.filter(m => m.personId !== p.id); save(); render(); }); break;
    case 'toggle': if (p){ p.present = !p.present; p.points = p.present ? p.points + 1 : Math.max(1, p.points - 1); save(); render(); } break;
    case 'sel': sel = (sel === id) ? null : id; lastQuery = ''; searchSeq++; render(); break;
    case 'pick': if (lastResults[+i]) addMovie(lastResults[+i]); break;
    case 'manual': if (lastQuery.trim()) addMovie({ title: lastQuery.trim(), year: '', poster: '' }); break;
    case 'rmmovie': S.movies = S.movies.filter(m => m.id !== id); save(); render(); break;
    case 'goto': go(id); break;
    case 'spin': spin(); break;
    case 'resetall': ask('Se borrarán participantes, puntos, propuestas e historial. ¿Seguro?', 'Borrar todo', () => {
        S = { people: [], movies: [], history: [], tab: 'club' }; sel = null; rot = 0; save(); render(); }); break;
  }
});
$('#view').addEventListener('input', e => {
  if (e.target.id !== 'q') return;
  clearTimeout(searchTimer);
  const val = e.target.value;
  searchTimer = setTimeout(() => runSearch(val), 350);
});
$('#view').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'newName'){ e.preventDefault(); addPerson(); }
});

function showHelp(){
  const d = $('#dlg');
  d.innerHTML = `<div class="dlg-card help" role="dialog" aria-label="Cómo funciona">
    <h3>Cómo funciona</h3>
    <ol>
      <li><b>Club:</b> añade a los participantes. Todos empiezan con 1 punto.</li>
      <li><b>Asistencia:</b> marca quién ha venido hoy. Cada asistente gana 1 punto.</li>
      <li><b>Pelis:</b> elige a una persona y busca su peli. Se añade a la ruleta.</li>
      <li><b>Ruleta:</b> cuantos más puntos tiene alguien, más grande es el trozo de su peli. Gira y sale la ganadora.</li>
      <li>Al ganar, esa persona vuelve a 1 punto. Pulsa «Nueva sesión» para preparar la siguiente.</li>
    </ol>
    <p>Los datos se guardan en este móvil.</p>
    <button class="btn primary block" data-dlg="no">Entendido</button>
  </div>`;
  d.hidden = false;
  d.onclick = e => { if (e.target === d || e.target.closest('[data-dlg]')) d.hidden = true; };
}
$('#helpBtn').addEventListener('click', showHelp);

function go(tab){ S.tab = tab; save(); render(); const m = $('#view'); if (m) m.scrollTop = 0; }
document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => go(b.dataset.tab)));
window.addEventListener('resize', drawWheel);

function render(){
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === S.tab));
  const n = presentPeople().length;
  $('#sub').textContent = `${n} ${n === 1 ? 'asistente' : 'asistentes'} · ${S.movies.length} ${S.movies.length === 1 ? 'propuesta' : 'propuestas'}`;
  const v = $('#view');
  ({ club: viewClub, asistencia: viewAsist, pelis: viewPelis, ruleta: viewRuleta }[S.tab] || viewClub)(v);
}
render();
</script>
